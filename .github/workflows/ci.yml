name: ci

# Three gates, cheapest first. The host tests and the fence audit need no
# ESP-IDF and run in seconds; the firmware build is last because it is slow.
# A red fence fails the whole run - that is the point of the fence.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: host tests (no board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the pure-C test suite
        run: make -C test/host CC=gcc
      - name: Round-screen bounds check (no primitive escapes the glass)
        run: make -C tools/render check CC=gcc

      - name: Fail if any check failed
        run: |
          out=$(make -C test/host CC=gcc 2>&1)
          echo "$out"
          echo "$out" | grep -qE '0 failures' || { echo "host tests reported failures"; exit 1; }

      # THE HOSTILE-INPUT SURFACE, UNDER SANITIZERS.
      #
      # Every 802.11 frame and BLE advertisement this firmware parses is a
      # buffer a stranger chose. The engines are pure C11, so the whole of
      # that surface is reachable from the host - and the sanitizers are what
      # actually detect the fault, which is why the harness builds with them
      # on by default rather than as an option.
      #
      # The sequence is seeded, so this is reproducible: a failure here is
      # replayable anywhere with `make -C test/fuzz replay SEED=<n>`, which is
      # worth more than a coverage-guided run that finds something once.
      - name: Fuzz the parsers and the verdicts (ASan + UBSan)
        run: |
          # Piped through tee rather than captured into a variable. With
          # `out=$(make ...)` under `bash -e`, a build failure aborts the step
          # before the echo, so the compiler error that caused it is never
          # printed - the log showed only "exit code 2".
          set -o pipefail
          make -C test/fuzz CC=gcc ITERS=1000000 STATE_ITERS=250000 2>&1 \
            | tee fuzz.out
          # Two harnesses report, and BOTH must say zero. Grepping for the
          # presence of "0 failures" was not enough once there were two:
          # one clean line satisfied it while the other reported failures.
          if grep -qE '[1-9][0-9]* failures' fuzz.out; then
            echo "fuzzing reported failures"; exit 1
          fi
          n=$(grep -c '0 failures' fuzz.out)
          if [ "$n" -ne 2 ]; then
            echo "expected both harnesses to report, saw $n"; exit 1
          fi

      - name: Host suite under ASan and UBSan
        run: |
          make -C test/host clean
          make -C test/host CC=gcc \
            CFLAGS="-std=c11 -O1 -g -Wall -Wextra -Wno-unused-parameter \
                    -fno-strict-aliasing -fsanitize=undefined,address \
                    -fno-sanitize-recover=all \
                    -I../../components/pharos_core/include \
                    -I../../components/pharos_engine/include \
                    -I../../components/pharos_radio/include \
                    -I../../components/pharos_ui/include"

  fence:
    name: transmit fence audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit the receive-only fence
        run: ./tools/check_tx_fence.sh

      - name: Audit lens linkage (source side)
        run: ./tools/check_lenses.sh

      - name: Audit the display path (source side)
        run: ./tools/check_display.sh

      - name: Audit source wiring (firmware and host builds agree)
        run: ./tools/check_sources.sh

  firmware:
    name: esp-idf build (${{ matrix.idf }})
    runs-on: ubuntu-latest
    needs: [ host-tests, fence ]
    strategy:
      fail-fast: false
      matrix:
        idf: [ "v5.5", "release-v6.0" ]
    steps:
      - uses: actions/checkout@v4
      # THE v5.5 IMAGE'S COMPONENT MANAGER DRIFTED OUT FROM UNDER US.
      #
      # It fails resolving the dependency tree with
      # "MissingKconfigError: LV_USE_FREETYPE" - a Kconfig key a newer
      # esp_lvgl_adapter manifest tests for and the pinned LVGL does not
      # define. Nothing in this repository changed: release-v6.0 builds the
      # same tree clean, and so does a fresh clone against ESP-IDF v5.5 with
      # idf-component-manager 2.5.0 locally.
      #
      # So the v5.5 leg is pinned to the manager version this project is known
      # to build with, rather than whatever the image ships this week. v6.0 is
      # left alone because it is green and pinning it would be a guess.
      - name: Build for ESP32-S3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: esp32s3
          path: '.'
          command: ${{ matrix.idf == 'v5.5' && 'pip install -q "idf-component-manager==2.5.0" && idf.py build' || 'idf.py build' }}
      - name: Re-audit the linked ELF
        run: |
          elf=$(find build -name 'pharos.elf' | head -n1)
          test -n "$elf" || { echo "no pharos.elf produced"; exit 1; }
          ./tools/check_tx_fence.sh "$elf"
          # The important one: prove every lens actually survived the link.
          # A lens registers from a constructor, so the linker will happily
          # discard it and still produce a clean, empty-feeling firmware.
          ./tools/check_lenses.sh "$elf"
          ./tools/check_display.sh "$elf"
