name: pages

# Publishes the browser flasher to GitHub Pages and puts the AUDITED release
# firmware next to it (same-origin, so no CORS). Nothing binary is committed to
# git - the workflow pulls the .bin from the release the release.yml workflow
# already built and fence/lens-audited, and serves it under a stable path the
# manifest points at.

on:
  # Deliberately NOT `release: published`.
  #
  # The github-pages environment has a deployment branch policy allowing only
  # `main`. A release-triggered run executes in the TAG's context (ref
  # refs/tags/vX.Y.Z), so the environment rejects it before a single step runs -
  # an instant, stepless red X on every single release. That, not the asset
  # race, is why the v1.4.0 and v1.5.0 deploys failed.
  #
  # `workflow_run` is the right door: it runs in the DEFAULT BRANCH's context,
  # which the policy allows, and it fires only once the release build has
  # actually finished - so the firmware asset already exists. Keeping the
  # environment locked to `main` is the correct posture; this fits it rather
  # than loosening it.
  workflow_run:
    workflows: [ "release" ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.5.0). Blank = newest."
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: vars
        run: |
          # workflow_run carries the tag in head_branch; a manual run passes it
          # in. Fall back to the newest release so a dispatch with no input
          # still does the right thing.
          TAG="${{ github.event.inputs.tag }}"
          [ -n "$TAG" ] || TAG="${{ github.event.workflow_run.head_branch }}"
          case "$TAG" in
            v*) ;;
            *)  TAG=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName) ;;
          esac
          echo "resolved tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p _site/firmware

          # The flasher page + manifest.
          cp docs/flasher/index.html _site/index.html
          cp docs/flasher/manifest.json _site/manifest.json
          # A logo for the tab/card, straight from the repo's branding.
          cp assets/branding/logo.png _site/logo.png || true

          # Wait for the firmware asset to exist.
          #
          # Triggering on workflow_run means the release build has already
          # finished, so this normally passes on the first look. It stays as
          # insurance for the manual-dispatch path, where a human may well fire
          # this off while the firmware is still compiling.
          #
          # The failure being guarded against is specific and nasty: publishing
          # the flasher with the PREVIOUS release's binary still in place - a
          # page that looks perfectly fine and installs the wrong firmware. So:
          # poll, with a ceiling, and fail loudly rather than publish stale.
          deadline=$(( SECONDS + 900 ))   # 15 minutes
          until gh release view "$TAG" --repo "${{ github.repository }}" \
                  --json assets --jq '.assets[].name' 2>/dev/null \
                | grep -qx -- "pharos-${TAG}-esp32s3.bin"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::pharos-${TAG}-esp32s3.bin missing on release $TAG after 15 min;" \
                   "refusing to publish the flasher with a stale binary"
              exit 1
            fi
            echo "waiting for the firmware asset on $TAG ..."
            sleep 20
          done

          # The audited firmware, under the stable path the manifest references.
          #
          # Match the VERSIONED name exactly. A glob of '*-esp32s3.bin' now
          # matches two assets - the versioned image and the stable
          # version-less copy that release.yml also uploads for curl/esptool -
          # and `--output` refuses to write more than one:
          #   unable to write more than one asset with `--output`, got 2 assets
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "pharos-${TAG}-esp32s3.bin" \
            --output _site/firmware/pharos-esp32s3.bin --clobber

          # Never ship an empty or truncated image to the flasher.
          size=$(stat -c%s _site/firmware/pharos-esp32s3.bin)
          echo "firmware: ${size} bytes"
          if [ "$size" -lt 200000 ]; then
            echo "::error::firmware looks truncated (${size} bytes)"
            exit 1
          fi

          # Reflect the real version in the manifest (cosmetic in the flasher UI).
          VER="${TAG#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VER}\"/" _site/manifest.json

          ls -lR _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
