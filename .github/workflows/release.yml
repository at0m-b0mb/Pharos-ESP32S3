name: release

# Builds the ESP32-S3 firmware on every version tag and attaches a flashable
# binary to the GitHub release. The binary is produced by the same ESP-IDF the
# CI build uses, and the transmit-fence and lens-linkage audits run against the
# linked ELF before anything is published - so a release binary is one that
# provably cannot transmit and provably contains every lens.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build + audit firmware
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Resolve tag
        id: vars
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.tag }}

      # Pinned for the same reason ci.yml is: the v5.5 image's component
      # manager drifted and now fails to resolve the tree with
      # "MissingKconfigError: LV_USE_FREETYPE". This file was missed when ci.yml
      # was fixed, so the first v3.5.0 release build failed on it. The source
      # is unchanged - only the manager that reads the manifests.
      - name: Build for ESP32-S3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: '.'
          command: 'pip install -q "idf-component-manager==2.5.0" && idf.py build'

      - name: Audit the linked ELF (fence + lenses + display)
        run: |
          elf=$(find build -name 'pharos.elf' | head -n1)
          test -n "$elf" || { echo "no pharos.elf produced"; exit 1; }
          ./tools/check_tx_fence.sh "$elf"
          ./tools/check_lenses.sh "$elf"
          # A release that boots to a black screen is worse than no release.
          ./tools/check_display.sh "$elf"

      - name: Assemble a flashable bundle
        run: |
          set -eo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          # Pin to esptool 4.x: the 5.x line changed merge_bin's CLI and default
          # output format, and this recipe targets the 4.x interface.
          python -m pip install --quiet "esptool~=4.8"

          # dist/ lives at the workspace root and is owned by the runner user.
          # build/ is created by the ESP-IDF container as root, so we must write
          # every output INTO dist/ (absolute path) - esptool writing its merged
          # image into the root-owned build/ is a permission error.
          DIST="$PWD/dist"
          mkdir -p "$DIST"

          # Merge bootloader + partition table + app into one image that flashes
          # at offset 0x0. build/flash_args holds the exact offsets idf.py used;
          # it references paths relative to build/, so run from there.
          ( cd build && python -m esptool --chip esp32s3 merge_bin \
              -o "$DIST/pharos-${TAG}-esp32s3.bin" @flash_args )

          # Also keep the component images, for anyone flashing at offsets.
          cp build/bootloader/bootloader.bin "$DIST/"
          cp build/partition_table/partition-table.bin "$DIST/"
          cp build/pharos.bin "$DIST/pharos-app.bin"

          # A stable, version-less copy so scripts can always fetch
          #   .../releases/latest/download/pharos-esp32s3.bin
          # (works for curl/wget/esptool; browsers cannot use it because GitHub
          # release assets carry no CORS header, which is why the web flasher
          # serves its own same-origin copy from Pages instead.)
          cp "$DIST/pharos-${TAG}-esp32s3.bin" "$DIST/pharos-esp32s3.bin"

          cat > dist/FLASH.md <<EOF
          # Flashing Pharos ${TAG} to a Waveshare ESP32-S3-Touch-AMOLED-1.75C

          Single-file image (simplest). Install esptool (\`pip install esptool\`),
          put the board in download mode, then:

              esptool.py --chip esp32s3 write_flash 0x0 pharos-${TAG}-esp32s3.bin

          Component images (if you prefer explicit offsets):

              esptool.py --chip esp32s3 write_flash \\
                0x0     bootloader.bin \\
                0x8000  partition-table.bin \\
                0x10000 pharos-app.bin

          If you are upgrading from a build older than v1.4.0, erase first -
          the partition layout and PSRAM settings changed:

              esptool.py --chip esp32s3 erase_flash

          Notes
          - The panel IS driven (CONFIG_PHAROS_HAS_VENDOR_BSP=y) via Waveshare's
            BSP; you should see the Pharos HUD. A serial console also runs at
            115200 - type 'help'. See docs/HARDWARE.md.
          - The transmit fence and lens linkage were audited against this exact
            ELF in CI before it was attached. It cannot transmit; it contains
            every lens.
          EOF

          sha256sum dist/* > "dist/SHA256SUMS.txt"
          ( cd dist && zip -q "pharos-${TAG}-esp32s3.zip" \
              "pharos-${TAG}-esp32s3.bin" bootloader.bin partition-table.bin \
              pharos-app.bin FLASH.md SHA256SUMS.txt )
          ls -l dist

      # WHY THIS EXISTS: the step below waits for the maintainer to write the
      # notes and only drops a one-line placeholder if they never appear. Both
      # v3.4.0 and v3.5.0 shipped with that placeholder as their entire release
      # page - the changelog said everything and the release said nothing.
      #
      # So the notes are composed here, from CHANGELOG.md, every time. A
      # maintainer's own notes still win (see below); this only decides what a
      # release says when nobody writes one by hand, and "Automated release" is
      # not an acceptable answer to "what changed".
      - name: Compose the release notes
        run: |
          set -eo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          NOTES="$PWD/dist/RELEASE_NOTES.md"

          # The section for THIS tag: from its heading to the next version
          # heading, without the heading itself.
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "( |$)" { f = 1; next }
            f && /^## v/ { exit }
            f { print }
          ' CHANGELOG.md > /tmp/section.md || true

          if [ ! -s /tmp/section.md ]; then
            echo "::warning::no CHANGELOG.md section for $TAG"
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n' \
              "${{ github.repository }}" "$TAG" > /tmp/section.md
          fi

          {
            sed -e 's/[[:space:]]*$//' /tmp/section.md
            cat <<EOF

          ## Flash it

          **From a browser** - Chrome or Edge, no tools to install:
          <https://at0m-b0mb.github.io/Pharos-ESP32S3/>

          **Or with esptool**, using the single merged image:

          \`\`\`
          pip install esptool
          esptool.py --chip esp32s3 write_flash 0x0 pharos-${TAG}-esp32s3.bin
          \`\`\`

          Upgrading from a build older than v1.4.0? Erase first - the partition
          layout and PSRAM settings changed:
          \`esptool.py --chip esp32s3 erase_flash\`

          ## What is attached

          | file | what it is |
          | --- | --- |
          | \`pharos-${TAG}-esp32s3.bin\` | the whole thing, flashes at 0x0 |
          | \`pharos-esp32s3.bin\` | same image at a version-less name, for scripts |
          | \`pharos-${TAG}-esp32s3.zip\` | the above plus component images and FLASH.md |
          | \`SHA256SUMS.txt\` | checksums for all of it |

          ## Audited in CI against this exact ELF

          - **Transmit fence** - no reachable path to a transmit primitive. This
            firmware receives only; the fence is enforced at link time, not by
            convention.
          - **Lens linkage** - every lens survived the link. A lens registers from
            a constructor, so the linker will happily discard one and still
            produce a clean, empty-feeling firmware.
          - **Display path** - the panel is driven via Waveshare's BSP.

          A serial console runs at 115200 - type \`help\`. See
          [docs/HARDWARE.md](https://github.com/${{ github.repository }}/blob/${TAG}/docs/HARDWARE.md).
          EOF
          } > "$NOTES"

          echo "--- composed $(wc -l < "$NOTES") lines ---"
          head -5 "$NOTES"

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          TAG="${{ steps.vars.outputs.tag }}"

          # The release object is normally created by the maintainer, but this
          # job is triggered by the TAG PUSH - so on a "push the tag, then write
          # the notes" workflow the build can finish first and upload into
          # nothing. v1.7.1 failed exactly that way: every audit passed and the
          # binary was simply dropped, with `release not found`.
          #
          # So wait for it, then create a placeholder only if the maintainer
          # never appeared. Waiting keeps their notes; creating stops a good
          # build from being thrown away.
          deadline=$(( SECONDS + 600 ))   # 10 minutes
          until gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::no release for $TAG after 10 minutes; creating one"
              gh release create "$TAG" --repo "${{ github.repository }}" \
                --title "Pharos $TAG" \
                --notes-file "$PWD/dist/RELEASE_NOTES.md" || true
              break
            fi
            echo "waiting for release $TAG to be created ..."
            sleep 20
          done

          # IF THE RELEASE IS STILL CARRYING THE OLD PLACEHOLDER, REPLACE IT.
          #
          # A maintainer's own notes always win - this only fires on the exact
          # string the placeholder used to write, so hand-written notes and
          # notes composed by an earlier run of this job are both left alone.
          body=$(gh release view "$TAG" --repo "${{ github.repository }}" \
                   --json body --jq .body 2>/dev/null || true)
          case "$body" in
            ""|"Automated release. Firmware built and audited in CI."*)
              echo "release body is empty or the old placeholder - writing real notes"
              gh release edit "$TAG" --repo "${{ github.repository }}" \
                --notes-file "$PWD/dist/RELEASE_NOTES.md" || true
              ;;
            *)
              echo "release already has notes - leaving them alone"
              ;;
          esac

          # Idempotent - --clobber replaces on re-run.
          gh release upload "$TAG" \
            "dist/pharos-${TAG}-esp32s3.bin" \
            "dist/pharos-esp32s3.bin" \
            "dist/pharos-${TAG}-esp32s3.zip" \
            "dist/SHA256SUMS.txt" \
            --clobber --repo "${{ github.repository }}"
