<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pharos banner">
  <defs>
    <radialGradient id="bn_field" cx="30%" cy="35%" r="90%">
      <stop offset="0%" stop-color="#103046"/>
      <stop offset="55%" stop-color="#0A1C2B"/>
      <stop offset="100%" stop-color="#04090F"/>
    </radialGradient>
    <linearGradient id="bn_tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF6FA"/>
      <stop offset="100%" stop-color="#9FC2D0"/>
    </linearGradient>
    <radialGradient id="bn_lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0C8"/>
      <stop offset="45%" stop-color="#FFC24B"/>
      <stop offset="100%" stop-color="#F09A1A"/>
    </radialGradient>
    <linearGradient id="bn_text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF6FA"/>
      <stop offset="100%" stop-color="#A9CEDA"/>
    </linearGradient>
    <filter id="bn_glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bn_field)"/>

  <!-- faint waterfall grid, evoking the spectrum lens -->
  <g stroke="#12384B" stroke-width="1" opacity="0.35">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="220" x2="1280" y2="220"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="420" x2="1280" y2="420"/>
    <line x1="0" y1="520" x2="1280" y2="520"/>
  </g>

  <!-- big round instrument on the right -->
  <g transform="translate(980,320)">
    <circle r="250" fill="#0B2334" stroke="#12384B" stroke-width="3"/>
    <circle r="250" fill="none" stroke="#1FB6C9" stroke-width="1.5" opacity="0.25"/>
    <!-- receive arcs -->
    <g fill="none" stroke-linecap="round">
      <path d="M -150 -12 A 150 150 0 0 1 150 -12" stroke="#1FB6C9" stroke-width="7" opacity="0.85"/>
      <path d="M -185 16 A 185 185 0 0 1 185 16" stroke="#1FB6C9" stroke-width="5" opacity="0.5"/>
      <path d="M -216 44 A 216 216 0 0 1 216 44" stroke="#1FB6C9" stroke-width="3" opacity="0.28"/>
    </g>
    <!-- tower -->
    <g transform="translate(0,20)">
      <path d="M -26 120 L -17 -40 L 17 -40 L 26 120 Z" fill="url(#bn_tower)"/>
      <path d="M -21 78 L 21 78 L 24 104 L -24 104 Z" fill="#C6392E" opacity="0.92"/>
      <path d="M -18 20 L 18 20 L 20 44 L -20 44 Z" fill="#C6392E" opacity="0.5"/>
      <rect x="-20" y="-50" width="40" height="12" rx="3" fill="#8FB2C0"/>
      <rect x="-13" y="-74" width="26" height="24" rx="4" fill="#0A1C2B" stroke="#8FB2C0" stroke-width="2"/>
      <circle cx="0" cy="-62" r="12" fill="url(#bn_lamp)" filter="url(#bn_glow)"/>
      <path d="M -13 -74 L 0 -90 L 13 -74 Z" fill="#8FB2C0"/>
      <path d="M -34 120 L 34 120 L 40 138 L -40 138 Z" fill="#7FA0AE"/>
    </g>
    <circle cx="0" cy="196" r="5" fill="#3DDC84"/>
  </g>

  <!-- wordmark + copy on the left -->
  <text x="90" y="250" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="132" font-weight="700" letter-spacing="6" fill="url(#bn_text)">PHAROS</text>
  <text x="94" y="308" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="30" letter-spacing="6" fill="#5F93A6">DEFENSIVE&#160;&#160;RF&#160;&#160;OBSERVATORY</text>

  <text x="94" y="384" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="24" letter-spacing="1" fill="#C9DEE6">Waveshare ESP32-S3-Touch-AMOLED-1.75C</text>

  <!-- three assurances -->
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#9FC2D0">
    <g transform="translate(94,440)"><circle cx="6" cy="-6" r="5" fill="#3DDC84"/><text x="24" y="0">receive-only &#183; a link-time fence, checked in CI</text></g>
    <g transform="translate(94,478)"><circle cx="6" cy="-6" r="5" fill="#1FB6C9"/><text x="24" y="0">honest by design &#183; every verdict carries its ceiling</text></g>
    <g transform="translate(94,516)"><circle cx="6" cy="-6" r="5" fill="#FFC24B"/><text x="24" y="0">red &amp; blue training &#183; the same engines you run live</text></g>
  </g>

  <text x="94" y="574" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="18" letter-spacing="2" fill="#4E7A8C">github.com/at0m-b0mb/Pharos-ESP32S3</text>
</svg>
