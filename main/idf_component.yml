## Managed component dependencies.
##
## The board driver is the Waveshare BSP for this exact panel; it is the
## authority on the CO5300 AMOLED init and the AXP2101 bring-up, and Pharos
## pins it rather than re-driving the hardware. LVGL 9 is the widget toolkit
## the round UI is built on.
dependencies:
  idf: ">=5.5"
  waveshare/esp32_s3_touch_amoled_1_75c: "^3.0.0"
  lvgl/lvgl: "^9.2.0"
